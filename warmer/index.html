<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Warmer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#EAECEA;--text:#111111;--muted:rgba(0,0,0,0.35);--dim:rgba(0,0,0,0.15);--chip:rgba(0,0,0,0.06);--line:rgba(0,0,0,0.08);--green:#3D6B35;--navy:#1C2D3A}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:390px;margin:0 auto;min-height:100vh;padding:56px 32px 48px;display:flex;flex-direction:column}
.wordmark{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:48px}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:28px}
.meta-sep{color:var(--dim)}
.temp-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:32px}
.temp-today{display:flex;flex-direction:column;gap:2px}
.temp-label{font-size:11px;color:var(--muted);letter-spacing:.5px}
.temp-val{font-size:22px;font-weight:400;color:var(--text);display:flex;align-items:center;gap:8px}
.temp-yesterday{text-align:right}
.temp-diff{font-size:11px;margin-top:2px}
.diff-warm{color:#9B4A1F}.diff-cool{color:var(--navy)}.diff-same{color:var(--muted)}
.prose{font-size:42px;font-weight:300;line-height:1.18;letter-spacing:-1px;margin-bottom:24px}
.prose .g{color:var(--muted)}.prose .w{color:var(--text);font-weight:500}
.prose .action{color:var(--green);font-style:italic;font-weight:300;font-size:38px}
.brief{font-size:15px;font-weight:300;line-height:1.75;color:rgba(0,0,0,0.55);margin-bottom:24px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid rgba(0,0,0,0.1);border-radius:100px;padding:7px 15px;font-size:13px;color:rgba(0,0,0,0.65)}
.div{height:1px;background:var(--line);margin-bottom:24px}
.feedback-section{margin-bottom:28px}
.sec-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.feedback-q{font-size:14px;color:rgba(0,0,0,0.6);margin-bottom:12px}
.fb-row{display:flex;gap:8px;flex-wrap:wrap}
.fb-btn{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid rgba(0,0,0,0.1);border-radius:100px;padding:8px 16px;font-size:13px;color:rgba(0,0,0,0.65);font-family:inherit;cursor:pointer;transition:all .15s}
.fb-btn:active{opacity:.6;transform:scale(.97)}
.fb-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.fb-btn.selected.warm{background:#9B4A1F;border-color:#9B4A1F}
.fb-thanks{font-size:13px;color:var(--muted);display:none;margin-top:10px}
.community{margin-bottom:28px;display:none}
.community-inner{background:rgba(0,0,0,0.04);border-radius:12px;padding:14px 16px}
.community-text{font-size:13px;color:rgba(0,0,0,0.6);line-height:1.6}
.community-count{font-size:11px;color:var(--muted);margin-top:4px}
.tl{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.tl-row{display:flex;align-items:baseline;font-size:14px}
.tl-t{width:40px;color:var(--muted);flex-shrink:0}
.tl-i{width:26px;flex-shrink:0}
.tl-d{flex:1;color:rgba(0,0,0,0.65)}
.tl-n{color:var(--muted);font-size:13px;margin-left:8px}
.cmp{margin-bottom:12px}
.cmp-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cmp-l{font-size:12px;color:var(--muted);width:30px}
.cmp-track{flex:1;height:2px;background:rgba(0,0,0,0.08);border-radius:1px;overflow:hidden}
.cmp-fill{height:100%;border-radius:1px;transition:width 1.2s cubic-bezier(.25,1,.5,1)}
.fill-y{background:rgba(0,0,0,0.2)}.fill-t{background:rgba(0,0,0,0.75)}
.cmp-v{font-size:12px;color:rgba(0,0,0,0.5);width:30px;text-align:right}
.uncertain{display:none;font-size:12px;color:#9B6B1F;align-items:center;gap:6px;margin-bottom:20px;background:rgba(155,107,31,0.08);padding:10px 14px;border-radius:10px}
.uncertain.on{display:flex}
.pivot{display:none;align-items:center;gap:10px;margin-bottom:20px;background:rgba(0,0,0,0.04);border-radius:12px;padding:12px 16px}
.pivot.on{display:flex}
.pivot-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.pivot-text{font-size:14px;font-weight:500}
.dots{display:flex;gap:5px;align-items:center;padding:8px 0}
.dot{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,60%,100%{opacity:.25;transform:scale(1)}30%{opacity:1;transform:scale(1.35)}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .45s ease forwards}
.refresh{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:auto;padding-top:16px;background:none;border:none;color:var(--muted);font-size:11px;font-family:inherit;cursor:pointer;letter-spacing:.5px}
.refresh:active{opacity:.4}
.lang-toggle{position:absolute;top:56px;right:32px;font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;letter-spacing:1px;text-transform:uppercase;font-family:inherit;padding:4px}
.lang-toggle:active{opacity:.5}
</style>
</head>
<body>
<div class="app">
<button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
<div class="wordmark">Warmer</div>
<div class="meta"><span id="locEl">—</span><span class="meta-sep">·</span><span id="dateEl">—</span></div>
<div class="temp-row">
<div class="temp-today"><div class="temp-label">TODAY</div><div class="temp-val"><span id="tempIcon">⛅</span><span id="tempVal">—°</span></div></div>
<div class="temp-yesterday"><div class="temp-label">YESTERDAY</div><div class="temp-val" id="yestVal">—°</div><div class="temp-diff" id="diffLabel">—</div></div>
</div>
<div class="prose" id="prose"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
<div class="brief" id="brief"></div>
<div class="chips" id="chips"></div>
<div class="div"></div>
<div class="community" id="community"><div class="sec-label" id="communityLabel">근처 사람들은</div><div class="community-inner"><div class="community-text" id="communityText">—</div><div class="community-count" id="communityCount"></div></div></div>
<div class="feedback-section">
<div class="sec-label" id="feedbackLabel">지금 밖은 어때?</div>
<div class="feedback-q" id="feedbackQ">예보랑 달라?</div>
<div class="fb-row" id="fbRow1">
<button class="fb-btn" id="fbBtnMatch" onclick="onFeedback1('match')">👍 맞아</button>
<button class="fb-btn" id="fbBtnDiff" onclick="onFeedback1('diff')">🌀 달라</button>
</div>
<div class="fb-row" id="fbRow2" style="display:none;margin-top:10px">
<button class="fb-btn" id="fbBtnColder" onclick="onFeedback2('colder')">🥶 더 추워</button>
<button class="fb-btn" id="fbBtnWarmer" onclick="onFeedback2('warmer')">🌤 더 따뜻해</button>
<button class="fb-btn" id="fbBtnRainy" onclick="onFeedback2('rainy')">🌧 비 와</button>
<button class="fb-btn" id="fbBtnWindy" onclick="onFeedback2('windy')">💨 바람 심해</button>
</div>
<div class="fb-thanks" id="fbThanks">고마워 👋 반영할게</div>
</div>
<div class="div"></div>
<div class="uncertain" id="uncertain"><span>〰</span><span id="uncertainText">오늘 날씨 변동성이 높아. 예보가 빗나갈 수 있어.</span></div>
<div class="pivot" id="pivot"><span style="font-size:18px">⏱</span><div><div class="pivot-label" id="pivotLabel">오늘 포인트</div><div class="pivot-text" id="pivotText">—</div></div></div>
<div class="sec-label" id="flowLabel">오늘 흐름</div>
<div class="tl" id="tl"></div>
<div class="sec-label" id="compLabel" style="margin-top:4px">어제 vs 오늘</div>
<div class="cmp" id="cmp"></div>
<button class="refresh" id="refreshBtn" onclick="init()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>새로고침</span></button>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,increment}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDqQdTvJ6jHn_xXLFDc_gJknVYJRKJ4xww",authDomain:"warmer-8a7ab.firebaseapp.com",projectId:"warmer-8a7ab",storageBucket:"warmer-8a7ab.firebasestorage.app",messagingSenderId:"1097930276522",appId:"1:1097930276522:web:a533c6efabfd1804f39ad3"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let lang=localStorage.getItem('lang')||'ko';
const t={
  ko:{
    loc:'내 위치',
    dsc:[[0,'맑음'],[2,'구름 조금'],[3,'흐림'],[48,'안개'],[57,'이슬비'],[67,'비'],[77,'눈'],[82,'소나기'],[86,'눈 소나기'],[99,'뇌우']],
    slots:['아침','낮','저녁'],
    pivot:{down:'저녁에 확 떨어져',up:'저녁에 많이 풀려',warm:'오후부터 따뜻해져',chill:'오후부터 쌀쌀해져'},
    cw:['훨씬 따뜻해','꽤 따뜻해','좀 따뜻해','많이 추워','꽤 추워','좀 쌀쌀해','비슷해'],
    cw:['훨씬 따뜻해','꽤 따뜻해','좀 따뜻해','많이 추워','꽤 추워','좀 쌀쌀해','비슷해'], // core words for temperature comparison
    ai:{
      system_instruction: `너는 날씨를 엄마처럼 챙겨주는 도우미야.
규칙:
- 2~3문장으로 짧고 자연스럽게 말해줘.
- 숫자 온도는 절대 쓰지 마. '쌀쌀하다', '포근하다', '무덥다' 등 다양한 체감 표현을 활용해줘. 어제와의 기온 차이를 바탕으로 체감 변화를 명확히 전달해.
- 하루 중 날씨 변화(기온, 강수)가 있다면 자연스럽게 언급하고, 특히 중요한 시간대(아침, 낮, 저녁)의 특징을 강조해줘.
- 강수 확률 언어 강도:
  · 20% 이하 → 비 언급 안 함
  · 20~40%   → "혹시 모르니까", "만약을 위해"
  · 40~60%   → "챙기는 게 나을 것 같아"
  · 60% 이상 → "꼭 챙겨" (단정)
- 마지막 문장은 항상 구체적이고 실용적인 행동 조언으로 마무리해줘.
- 날씨 변동성이 높을 때는 예보가 달라질 수 있음을 부드럽게 알려주고, 대비할 수 있도록 조언해줘.
- 응답 마지막 줄: ITEMS:["☂️ 우산","🧥 바람막이"] 형식으로, 날씨와 행동 조언에 가장 적합한 1~2개의 아이템을 추천해줘.`,
      prompt_template: (p, dsc_func, slot_labels) => {
        const {tMax,tMin,yMax,yMin,tCode,wind,slots,diff,highU,pivot,feels} = p;
        let promptDescription = `오늘의 날씨 정보입니다:\n`;
        promptDescription += `- 오늘 최고 기온은 ${tMax}°C, 최저 기온은 ${tMin}°C이며, 현재 체감 온도는 ${feels}°C입니다.\n`;
        promptDescription += `- 어제 최고 기온은 ${yMax}°C, 최저 기온은 ${yMin}°C였습니다.\n`;
        promptDescription += `- 어제 대비 기온 변화는 ${diff > 0 ? '+' : ''}${diff}도입니다.\n`;
        promptDescription += `- 오늘의 전반적인 날씨는 ${dsc_func(tCode)}이며, 바람은 ${wind}m/s입니다.\n`;
        promptDescription += `- 시간대별 예보:\n`;
        slots.forEach((s, i) => {
          promptDescription += `  - ${slot_labels[i]}: ${s.temp}°C, ${dsc_func(s.code)}, 강수 확률 ${s.rain}%\n`;
        });
        if (highU) { promptDescription += `- 날씨 변동성이 높습니다. 예보가 달라질 수 있습니다.\n`; }
        if (pivot) { promptDescription += `- 하루 중 중요한 기온 변화 포인트: "${pivot}"\n`; }
        promptDescription += `이 정보를 바탕으로 사용자에게 친근하고 섬세한 날씨 브리핑을 해 주세요.`;
        return promptDescription;
      },
      fallback_brief: {
        warm_much: '어제보다 꽤 따뜻해. 가볍게 입어.',
        warm_some: '어제보다 좀 따뜻해. 저녁엔 챙겨.',
        cold_much: '어제보다 많이 추워. 따뜻하게 입고 나가.',
        cold_some: '어제보다 쌀쌀해. 겉에 뭐 하나 걸쳐.',
        similar: '어제랑 비슷해. 크게 다르지 않아.'
      }
    },
    action:['우산 꼭 챙겨.','우산 챙기는 게 나을 것 같아.','따뜻하게 입고 나가.','따뜻하게 껴입어.','겉에 뭐 하나 걸쳐.','가볍게 입어도 돼.','크게 다르진 않아.'],
    fw:['매우 차갑게','꽤 차갑게','선선하게','적당하게','따뜻하게'],
    proseSim:f=>`<span class="g">어제랑</span> <span class="w">비슷해</span><br><span class="g">체감은 </span><span class="w">${f}</span><span class="g">.</span>`,
    proseDiff:(c,f)=>`<span class="g">어제보다</span> <span class="w">${c}</span><br><span class="g">체감은 </span><span class="w">${f}</span><span class="g">.</span>`,
    ui:{
      community:'근처 사람들은',match:'예보가 맞는 것 같아',people:(l,n)=>`근처에서 ${l.join(', ')}고 해`,count:n=>`${n}명 응답`,
      feedback:'지금 밖은 어때?',q:'예보랑 달라?',m:'👍 맞아',d:'🌀 달라',
      colder:'🥶 더 추워',warmer:'🌤 더 따뜻해',rainy:'🌧 비 와',windy:'💨 바람 심해',thanks:'고마워 👋 반영할게',
      uncertain:'오늘 날씨 변동성이 높아. 예보가 빗나갈 수 있어.',pivot:'오늘 포인트',flow:'오늘 흐름',comp:'어제 vs 오늘',refresh:'새로고침',
      c:'더 춥다',w:'더 따뜻하다',r:'비 온다',wd:'바람 심하다',y:'어제',t:'오늘',warmLabel:d=>`+${d}도 따뜻`,coolLabel:d=>`${d}도 추워`,sameLabel:'비슷'
    }
  },
  en:{
    loc:'My Location',
    dsc:[[0,'Clear'],[2,'Partly Cloudy'],[3,'Overcast'],[48,'Fog'],[57,'Drizzle'],[67,'Rain'],[77,'Snow'],[82,'Showers'],[86,'Snow Showers'],[99,'Thunderstorm']],
    slots:['Morning','Day','Evening'],
    pivot:{down:'Drops sharply tonight',up:'Warmer this evening',warm:'Warmer this afternoon',chill:'Chilly this afternoon'},
    cw:['much warmer','quite warm','a bit warmer','much colder','quite cold','a bit chilly','similar'],
    cw:['much warmer','quite warm','a bit warmer','much colder','quite cold','a bit chilly','similar'], // core words for temperature comparison
    ai:{
      system_instruction: `You are a weather assistant who cares for the user like a mother.
Rules:
- Keep it short and natural, 2-3 sentences.
- Never use numerical temperatures. Use descriptive terms like "quite chilly", "much warmer". Clearly convey the perceived temperature change compared to yesterday.
- If there are weather changes throughout the day (temperature, precipitation), mention them naturally, emphasizing key times (morning, day, evening).
- Precipitation probability intensity:
  · Below 20% → Do not mention rain.
  · 20-40%    → "Just in case", "For a rainy day"
  · 40-60%    → "It might be good to bring one"
  · 60% or more → "Definitely bring one" (assertive)
- The last sentence must always end with specific, practical advice.
- If weather volatility is high, gently inform the user that the forecast might change and advise them to be prepared.
- The last line of the response must be in the format: ITEMS:["☂️ Umbrella","🧥 Windbreaker"] — recommend up to 1-2 items most suitable for the weather and advice.`,
      prompt_template: (p, dsc_func, slot_labels) => {
        const {tMax,tMin,yMax,yMin,tCode,wind,slots,diff,highU,pivot,feels} = p;
        let promptDescription = `Today's weather information:\n`;
        promptDescription += `- Today's max temperature is ${tMax}°C, min temperature is ${tMin}°C, and current apparent temperature is ${feels}°C.\n`;
        promptDescription += `- Yesterday's max temperature was ${yMax}°C, min temperature was ${yMin}°C.\n`;
        promptDescription += `- Temperature change compared to yesterday: ${diff > 0 ? '+' : ''}${diff}°C.\n`;
        promptDescription += `- Overall weather today is ${dsc_func(tCode)}, with wind at ${wind}m/s.\n`;
        promptDescription += `- Hourly forecast:\n`;
        slots.forEach((s, i) => {
          promptDescription += `  - ${slot_labels[i]}: ${s.temp}°C, ${dsc_func(s.code)}, precipitation probability ${s.rain}%\n`;
        });
        if (highU) { promptDescription += `- Weather volatility is high. The forecast might change.\n`; }
        if (pivot) { promptDescription += `- Key temperature change point today: "${pivot}"\n`; }
        promptDescription += `Based on this information, please provide a friendly and detailed weather briefing to the user.`;
        return promptDescription;
      },
      fallback_brief: {
        warm_much: 'It\'s quite warmer than yesterday. Dress lightly.',
        warm_some: 'It\'s a bit warmer than yesterday. Bring something for the evening.',
        cold_much: 'It\'s much colder than yesterday. Dress warmly.',
        cold_some: 'It\'s a bit chilly than yesterday. Wear a jacket.',
        similar: 'It\'s similar to yesterday. Not much different.'
      }
    },
    action:['Take an umbrella.','Better take an umbrella.','Dress warmly.','Bundle up.','Take a jacket.','Dress light.','Not much different.'],
    fw:['very cold','quite cold','chilly','pleasant','warm'],
    proseSim:f=>`<span class="w">Similar</span> <span class="g">to yesterday</span><br><span class="g">Feels </span><span class="w">${f}</span><span class="g">.</span>`,
    proseDiff:(c,f)=>`<span class="w">${c}</span> <span class="g">than yesterday</span><br><span class="g">Feels </span><span class="w">${f}</span><span class="g">.</span>`,
    ui:{
      community:'People nearby',match:'Forecast seems correct',people:(l,n)=>`Nearby: ${l.join(', ')}`,count:n=>`${n} responses`,
      feedback:'HOW IS IT OUTSIDE?',q:'Different from forecast?',m:'👍 Correct',d:'🌀 No',
      colder:'🥶 Colder',warmer:'🌤 Warmer',rainy:'🌧 Rainy',windy:'💨 Windy',thanks:"Thanks! I'll update it.",
      uncertain:'High volatility. Forecast might be off.',pivot:"TODAY'S POINT",flow:"TODAY'S FLOW",comp:'YESTERDAY VS TODAY',refresh:'REFRESH',
      c:'Colder',w:'Warmer',r:'Rainy',wd:'Windy',y:'Yest',t:'Today',warmLabel:d=>`${d}° warmer`,coolLabel:d=>`${d}° colder`,sameLabel:'Same'
    }
  }
};

import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const geoLoc=()=>new Promise(res=>{if(!navigator.geolocation)return res({lat:52.52,lon:13.41});navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res({lat:52.52,lon:13.41}))});
async function geoName(lat,lon){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);const d=await r.json();return d.address?.suburb||d.address?.city_district||d.address?.city||d.address?.town||t[lang].loc}catch{return t[lang].loc}}
async function fetchW(lat,lon){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode,windspeed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&past_days=1&forecast_days=1&timezone=auto`;return(await fetch(u)).json()}
function parse(data){const now=new Date(),h=now.getHours(),S=24;const tMax=Math.round(data.daily.temperature_2m_max[1]),tMin=Math.round(data.daily.temperature_2m_min[1]),yMax=Math.round(data.daily.temperature_2m_max[0]),yMin=Math.round(data.daily.temperature_2m_min[0]),tCode=data.daily.weathercode[1],yCode=data.daily.weathercode[0],feels=Math.round(data.hourly.apparent_temperature[S+h]);
const slots=[{label:t[lang].slots[0],h:8},{label:t[lang].slots[1],h:13},{label:t[lang].slots[2],h:19}].map(s=>({label:s.label,temp:Math.round(data.hourly.temperature_2m[S+s.h]),code:data.hourly.weathercode[S+s.h],rain:data.hourly.precipitation_probability[S+s.h]??0}));
const diff=tMax-yMax,rv=slots.map(s=>s.rain),rm=rv.reduce((a,b)=>a+b,0)/3,rvar=rv.reduce((a,b)=>a+(b-rm)**2,0)/3,swing=Math.abs(slots[2].temp-slots[0].temp),cats=new Set(slots.map(s=>s.code<=2?'c':s.code===3?'cl':s.code<=67?'r':s.code<=77?'s':'st')),highU=rvar>400||swing>=8||cats.size>=3,mn=slots[1].temp-slots[0].temp,ne=slots[2].temp-slots[1].temp;
const pivot=Math.abs(ne)>=5?(ne<0?t[lang].pivot.down:t[lang].pivot.up):Math.abs(mn)>=5?(mn>0?t[lang].pivot.warm:t[lang].pivot.chill):'';return{tMax,tMin,yMax,yMin,tCode,yCode,feels,slots,diff,highU,pivot,now}}
function buildProse(p){const{diff,tCode,feels,slots}=p,cl=t[lang].cw,cw=diff>=8?cl[0]:diff>=4?cl[1]:diff>=2?cl[2]:diff<=-8?cl[3]:diff<=-4?cl[4]:diff<=-2?cl[5]:cl[6],rp=Math.max(...slots.map(s=>s.rain)),al=t[lang].action,action=rp>60?al[0]:rp>30?al[1]:tCode>=70?al[2]:diff<=-4?al[3]:diff<=-2?al[4]:diff>=4?al[5]:al[6],fl=t[lang].fw,fw=feels<=0?fl[0]:feels<=8?fl[1]:feels<=15?fl[2]:feels<=22?fl[3]:fl[4];
return(Math.abs(diff)<=1?t[lang].proseSim(fw):t[lang].proseDiff(cw,fw))+`<br><span class="action">${action}</span>`}

// ── AI 브리핑 ──
async function getAI(p) {
  const system_instruction = t[lang].ai.system_instruction;
  const prompt = t[lang].ai.prompt_template(p, dsc, t[lang].slots);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 250,
        system: system_instruction,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const d = await res.json();
    const raw = d.content?.[0]?.text || '';
    const m = raw.match(/ITEMS:(\[.*?\])/);
    let items = [], brief = raw;
    if (m) {
      try { items = JSON.parse(m[1]); } catch { }
      brief = raw.replace(/ITEMS:.*$/, '').trim();
    }
    return { brief, items };
  } catch (e) {
    console.error("AI API Error:", e);
    const fallbackBriefs = t[lang].ai.fallback_brief;
    let brief;
    if (p.diff >= 4) { brief = fallbackBriefs.warm_much; }
    else if (p.diff >= 2) { brief = fallbackBriefs.warm_some; }
    else if (p.diff <= -4) { brief = fallbackBriefs.cold_much; }
    else if (p.diff <= -2) { brief = fallbackBriefs.cold_some; }
    else { brief = fallbackBriefs.similar; }

    const items = [];
    if (p.slots.some(s => s.rain > 40)) items.push('☂️ ' + (lang === 'ko' ? '우산' : 'Umbrella'));
    if (p.wind > 5) items.push('🧥 ' + (lang === 'ko' ? '바람막이' : 'Windbreaker'));
    return { brief, items };
  }
}
